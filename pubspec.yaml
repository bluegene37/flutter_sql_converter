name: flutter_sql_converter
description: "A high-performance desktop workbench that converts Magic UniPaaS/XPA program repositories into Microsoft SQL Server (T-SQL) queries and explores schema relationships. For Windows and macOS."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  xml: ^7.0.1
  file_picker: ^12.1.1
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.7
  inno_bundle: ^0.12.0

# App icons for Windows/macOS — regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

# MSIX package (Microsoft Store / enterprise deployment) — build with:
#   dart run msix:create
# Keep msix_version in sync with version: above (four segments).
# To sign with a certificate:
#   certificate_path: "path/to/cert.pfx"
#   certificate_password: "password"
#   publisher: "CN=Genexis, O=Genexis" # Must match certificate Subject exactly
msix_config:
  display_name: "MagicSoftSQL"
  publisher_display_name: "Genexis"
  identity_name: "dev.genexis.magicsoftsql"
  msix_version: "1.0.2.0"
  logo_path: "windows/runner/resources/app_icon.ico"
  capabilities: "internetClient"

# Inno Setup installer (setup.exe for direct distribution) — build on Windows with:
#   flutter build windows --release
#   dart run inno_bundle:build --release --no-app
# Sign with scripts/sign_windows.ps1 or via GitHub Actions (WINDOWS_CERT_BASE64)
# Output: build/windows/x64/installer/
inno_bundle:
  id: "382E5891-375B-4E2D-886C-20EAE6BE2006" # installer AppId — never change or reuse
  name: "MagicSoftSQL"
  publisher: "Genexis"
  installer_icon: "windows/runner/resources/app_icon.ico"
  admin: "auto"
  languages:
    - "english"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/schema_data.json
    - assets/logo.png
    - assets/logo_icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
