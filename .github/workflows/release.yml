name: Release

# Builds the Windows installer and macOS DMG and attaches them to a
# GitHub release whenever a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release

      # Code signing for application binary (if WINDOWS_CERT_BASE64 secret is configured)
      - name: Sign application binary
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping application binary signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            $runnerExe = "build/windows/x64/runner/Release/flutter_sql_converter.exe"
            if (Test-Path $runnerExe) {
              .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $runnerExe
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      # Inno Setup (ISCC) is preinstalled on windows-latest runners.
      - run: dart run inno_bundle:build --release --no-app

      # Code signing for installer executable (if WINDOWS_CERT_BASE64 secret is configured)
      - name: Sign installer executable
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 secret is not configured. Skipping installer signing." -ForegroundColor Yellow
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows_cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          try {
            $installerExes = Get-ChildItem -Path "build/windows/x64/installer/*.exe"
            foreach ($exe in $installerExes) {
              .\scripts\sign_windows.ps1 -CertPath $certPath -CertPassword "$env:WINDOWS_CERT_PASSWORD" -TargetPath $exe.FullName
            }
          } finally {
            if (Test-Path $certPath) { Remove-Item -Force $certPath }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/**/*.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: bash scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/*.dmg
          generate_release_notes: true
