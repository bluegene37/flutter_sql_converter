name: Release

# Builds the Windows installer and macOS DMG and attaches them to a
# GitHub release whenever a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      # Inno Setup (ISCC) is preinstalled on windows-latest runners.
      - run: dart run inno_bundle:build --release --no-app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/windows/x64/installer/**/*.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: bash scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/*.dmg
          generate_release_notes: true
